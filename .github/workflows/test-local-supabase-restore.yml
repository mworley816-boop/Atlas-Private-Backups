name: Test Atlas restore in isolated local Supabase
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  local-supabase-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PGHOST: 127.0.0.1
      PGPORT: "54322"
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres
      PGSSLMODE: disable
    steps:
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-local"
          cd "$RUNNER_TEMP/atlas-local"
          supabase init --yes
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1 || {
            echo "FAIL: isolated local Supabase stack could not start."
            exit 1
          }
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" postgres:17 \
            psql -X -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -qAt -c 'SELECT 1' | grep -qx 1
          echo "PASS: disposable Supabase database started on loopback."

      - name: Download verified encrypted backup
        uses: actions/download-artifact@v4
        with:
          name: atlas-encrypted-db-backup
          run-id: 41124252561
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/encrypted

      - name: Restore application schema and data into local Supabase
        shell: bash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.ATLAS_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BACKUP_PASSPHRASE"
          mkdir -p "$RUNNER_TEMP/restore-files"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output "$RUNNER_TEMP/backup.tar.gz" "$RUNNER_TEMP/encrypted/atlas-backup.tar.gz.gpg"
          tar -xzf "$RUNNER_TEMP/backup.tar.gz" -C "$RUNNER_TEMP/restore-files" --no-same-owner --no-same-permissions
          cd "$RUNNER_TEMP/restore-files"
          sha256sum --status -c SHA256SUMS
          for f in roles.sql schema.sql data.sql; do test -s "$f"; done
          # The local Supabase stack already provisions managed roles and schemas.
          # roles.sql is integrity-checked but not executed to avoid duplicate-role errors.
          # No production database URL or token is passed to this job.
          test "$PGHOST" = 127.0.0.1
          test "$PGPORT" = 54322
          test "$PGDATABASE" = postgres
          echo "Starting strict application schema restore against disposable local Supabase..."
          if ! docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$RUNNER_TEMP/restore-files:/restore:ro" postgres:17 \
            psql -X -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
            -v ON_ERROR_STOP=1 --single-transaction -q -f /restore/schema.sql \
            > "$RUNNER_TEMP/schema-restore.log" 2>&1; then
            echo "FAIL: schema restore; see private runner diagnostics (not uploaded)."
            exit 1
          fi
          # Temporarily relax row-level security only inside this disposable
          # local Supabase database. The backup's application RLS definitions
          # remain intact; this affects only the import session.
          echo "Starting strict data restore..."
          if ! docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$RUNNER_TEMP/restore-files:/restore:ro" postgres:17 \
            psql -X -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
            -v ON_ERROR_STOP=1 --single-transaction -q \
            -c 'SET session_replication_role = replica' \
            -c 'SET row_security = off' -f /restore/data.sql \
            > "$RUNNER_TEMP/data-restore.log" 2>&1; then
            echo "FAIL: data restore in disposable Supabase."
            # Report only a recognized SQLSTATE (five-character code), never
            # SQL statements, identifiers, or database values.
            code=$(grep -Eo 'SQL state: [0-9A-Z]{5}' "$RUNNER_TEMP/data-restore.log" | head -n 1 | cut -d' ' -f3 || true)
            if [ -n "$code" ]; then echo "SQLSTATE: $code"; fi
            # The failure's table/column names and input lines are private.
            # A generic failure category is safe to report publicly.
            if grep -Eqi 'duplicate key value violates unique constraint' "$RUNNER_TEMP/data-restore.log"; then
              echo "Category: duplicate-key conflict in pre-populated Supabase tables."
            elif grep -Eqi 'violates foreign key constraint' "$RUNNER_TEMP/data-restore.log"; then
              echo "Category: foreign-key dependency."
            elif grep -Eqi 'already exists|duplicate object' "$RUNNER_TEMP/data-restore.log"; then
              echo "Category: object already exists."
            elif grep -Eqi 'permission denied|must be owner' "$RUNNER_TEMP/data-restore.log"; then
              echo "Category: database permissions."
              if grep -Eqi 'permission denied for schema' "$RUNNER_TEMP/data-restore.log"; then
                echo "Permission subtype: schema access."
              elif grep -Eqi 'permission denied for table|must be owner of table' "$RUNNER_TEMP/data-restore.log"; then
                echo "Permission subtype: table access or ownership."
                if grep -Eqi 'must be owner of table' "$RUNNER_TEMP/data-restore.log"; then
                  echo "Table failure detail: ownership required."
                elif grep -Eqi 'permission denied for table' "$RUNNER_TEMP/data-restore.log"; then
                  echo "Table failure detail: access privilege required."
                  # Classify the first denied table without printing its identifier.
                  first_denied=$(grep -im1 -E 'permission denied for table ' "$RUNNER_TEMP/data-restore.log" || true)
                  denied_name=${first_denied##*permission denied for table }
                  denied_name=${denied_name%% *}
                  # Supabase-managed schemas are distinguishable by their
                  # first denied COPY target; don't output identifiers.
                  first_copy=$(grep -m1 '^COPY ' "$RUNNER_TEMP/restore-files/data.sql" || true)
                  if [ -n "$first_copy" ]; then
                    echo "Diagnostic: backup contains COPY-format data."
                  fi
                  if [ -n "$denied_name" ]; then
                    echo "Diagnostic: first denied table identifier captured privately."
                    # Run a real SQL file (avoids shell quote-escaping errors).
                    # Query catalogs only, never user rows.
                    cat > "$RUNNER_TEMP/restore-files/classify.sql" <<'SQL'
          SELECT CASE
            WHEN count(*) = 0 THEN 'no-match'
            WHEN count(*) > 1 THEN 'multiple-matches'
            WHEN bool_or(n.nspname IN ('auth','storage','realtime','supabase_functions','vault','extensions','graphql','_realtime')) THEN 'managed'
            WHEN bool_or(n.nspname = 'public') THEN 'public'
            WHEN bool_or(n.nspname LIKE 'pg_%' OR n.nspname = 'information_schema') THEN 'system'
            ELSE 'other'
          END
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE c.relname = :'target' AND c.relkind IN ('r','p');
          SQL
                    catalog_status=0
                    catalog_result=$(docker run --rm --network host \
                      -e PGPASSWORD="$PGPASSWORD" -e DENIED_TABLE="$denied_name" \
                      -v "$RUNNER_TEMP/restore-files:/restore:ro" postgres:17 \
                      sh -c 'psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -qAt -v ON_ERROR_STOP=1 -v target="$DENIED_TABLE" -f /restore/classify.sql 2>/dev/null') || catalog_status=$?
                    if [ "$catalog_status" -ne 0 ]; then
                      echo "Denied-table catalog query: execution failed."
                    else
                      echo "Denied-table catalog query: executed."
                    fi
                    if [ -z "$catalog_result" ]; then
                      echo "Denied-table catalog classification: unavailable or no match."
                    elif printf '%s\n' "$catalog_result" | grep -qx managed; then
                      echo "Denied-table catalog classification: Supabase-managed table."
                    elif printf '%s\n' "$catalog_result" | grep -qx public; then
                      echo "Denied-table catalog classification: public application table."
                    elif printf '%s\n' "$catalog_result" | grep -qx multiple-matches; then
                      echo "Denied-table catalog classification: multiple schemas share table name."
                    elif printf '%s\n' "$catalog_result" | grep -qx no-match; then
                      echo "Denied-table catalog classification: no matching table."
                    elif printf '%s\n' "$catalog_result" | grep -qx system; then
                      echo "Denied-table catalog classification: PostgreSQL system schema."
                    elif printf '%s\n' "$catalog_result" | grep -qx other; then
                      echo "Denied-table catalog classification: other non-public schema."
                    else
                      echo "Denied-table catalog classification: unexpected diagnostic output."
                    fi
                  fi
                fi
              elif grep -Eqi 'permission denied for sequence' "$RUNNER_TEMP/data-restore.log"; then
                echo "Permission subtype: sequence access."
              elif grep -Eqi 'permission denied to set parameter|permission denied to set role|must be superuser|superuser' "$RUNNER_TEMP/data-restore.log"; then
                echo "Permission subtype: privileged session operation."
              elif grep -Eqi 'permission denied for function' "$RUNNER_TEMP/data-restore.log"; then
                echo "Permission subtype: function access."
              else
                echo "Permission subtype: unspecified database privilege."
              fi
            elif grep -Eqi 'does not exist' "$RUNNER_TEMP/data-restore.log"; then
              echo "Category: missing dependency."
            elif grep -Eqi 'COPY .* line [0-9]+' "$RUNNER_TEMP/data-restore.log"; then
              echo "Category: data COPY/import error."
            else
              echo "Category: other SQL restore failure (details suppressed)."
            fi
            # Independent diagnostic: test public-schema COPY data only.
            # The failed full import was transactional, so it left no partial rows.
            # Never publish raw SQL, identifiers, or imported records.
            python3 - "$RUNNER_TEMP/restore-files/data.sql" "$RUNNER_TEMP/restore-files/public-only.sql" <<'PY'
          import sys
          source, target = sys.argv[1:]
          copy_count = public_count = other_count = 0
          in_copy = keep = False
          with open(source, encoding="utf-8", errors="replace") as src, open(target, "w", encoding="utf-8") as dst:
              for line in src:
                  if not in_copy and line.startswith("COPY "):
                      copy_count += 1
                      table = line.split(None, 2)[1]
                      keep = table.startswith(("public.", '"public".'))
                      public_count += int(keep)
                      other_count += int(not keep)
                      in_copy = True
                  if in_copy and keep:
                      dst.write(line)
                  if in_copy and line.rstrip("\r\n") == r"\.":
                      in_copy = keep = False
          print(f"Backup SQL structure: COPY blocks={copy_count}; public={public_count}; other={other_count}.")
          if copy_count == 0:
              print("Application-only diagnostic: no COPY-format blocks found.")
          elif public_count == 0:
              print("Application-only diagnostic: no public-schema COPY blocks found.")
          else:
              print("Application-only diagnostic: public-schema COPY blocks extracted.")
          PY
            if ! grep -q '^COPY ' "$RUNNER_TEMP/restore-files/public-only.sql"; then
              echo "Application-only restore skipped: no public COPY blocks."
              exit 1
            fi
            if docker run --rm --network host \
              -e PGPASSWORD="$PGPASSWORD" \
              -v "$RUNNER_TEMP/restore-files:/restore:ro" postgres:17 \
              psql -X -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
              -v ON_ERROR_STOP=1 --single-transaction -q \
              -c 'SET session_replication_role = replica' \
              -c 'SET row_security = off' -f /restore/public-only.sql \
              > "$RUNNER_TEMP/public-only-restore.log" 2>&1; then
              echo "PASS: public-schema COPY data imported into disposable Supabase."
              echo "LIMITATION: managed-schema data, sequence values, and complete recovery not verified."
            else
              echo "FAIL: public-schema COPY data import in disposable Supabase."
            fi
            exit 1
          fi
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" postgres:17 \
            psql -X -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
            -qAt -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" \
            > "$RUNNER_TEMP/public-table-count"
          # Compare every public COPY block's row count with the restored table.
          # Table identifiers and counts remain in runner-private files only.
          python3 - "$RUNNER_TEMP/restore-files/data.sql" "$RUNNER_TEMP/restore-files/check-counts.sql" "$RUNNER_TEMP/restore-files/expected-counts" <<'PY'
          import re
          import sys
          source, sql_path, expected_path = sys.argv[1:]
          # PostgreSQL COPY headers may include quoted names; use the first
          # table token while validating that the statement is a public COPY.
          header = re.compile(r'^COPY\s+((?:public\.)?(?:"[^"]+"|[A-Za-z_][A-Za-z_0-9]*))\s*\(', re.I)
          tables = []
          current = None
          copy_lines = 0
          public_copy_lines = 0
          copy_parenthesis_headers = 0
          copy_from_stdin_headers = 0
          copy_has_space_before_paren = 0
          copy_has_quote = 0
          copy_has_schema_separator = 0
          with open(source, encoding="utf-8") as src:
              for line in src:
                  if line.startswith("COPY "):
                      copy_lines += 1
                      if "(" in line: copy_parenthesis_headers += 1
                      if "FROM stdin" in line: copy_from_stdin_headers += 1
                      if " (" in line: copy_has_space_before_paren += 1
                      if chr(34) in line: copy_has_quote += 1
                      if "." in line.partition("(")[0]: copy_has_schema_separator += 1
                  if line.startswith("COPY public."):
                      public_copy_lines += 1
                  if current is None:
                      match = header.match(line)
                      if match:
                          current = [match.group(1), 0]
                  elif line.strip() == chr(92) + ".":
                      tables.append(current)
                      current = None
                  else:
                      current[1] += 1
          if current is not None or not tables:
              print(f"Integrity diagnostic: copy_headers={copy_lines}, public_copy_headers={public_copy_lines}, with_parenthesis={copy_parenthesis_headers}, from_stdin={copy_from_stdin_headers}, space_before_parenthesis={copy_has_space_before_paren}, quoted_header={copy_has_quote}, qualified_header={copy_has_schema_separator}, matched_blocks={len(tables)}, unterminated_block={current is not None}.")
              raise SystemExit("FAIL: application COPY integrity metadata missing or incomplete.")
          with open(sql_path, "w") as sql, open(expected_path, "w") as expected:
              for table, count in tables:
                  sql.write("SELECT COUNT(*) FROM " + table + ";" + chr(10))
                  expected.write(str(count) + chr(10))
          print(f"Integrity check: prepared row-count comparisons for {len(tables)} application tables.")
          PY
          if ! docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$RUNNER_TEMP/restore-files:/restore:ro" postgres:17 \
            psql -X -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
            -v ON_ERROR_STOP=1 -qAt -f /restore/check-counts.sql \
            > "$RUNNER_TEMP/restore-files/actual-counts" 2> "$RUNNER_TEMP/integrity-errors.log"; then
            echo "FAIL: restored application row-count queries could not complete."
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/restore-files/expected-counts" "$RUNNER_TEMP/restore-files/actual-counts"; then
            echo "FAIL: application row counts differ from encrypted backup."
            exit 1
          fi
          echo "PASS: all application COPY row counts match restored tables."
          echo "PASS: application schema and data SQL restored to disposable local Supabase."
          echo "Public tables: $(cat "$RUNNER_TEMP/public-table-count")"
          echo "LIMITATION: roles.sql was not executed; Supabase managed services, Storage files, and end-to-end recovery are not validated."

      - name: Destroy disposable environment and plaintext
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/atlas-local" 2>/dev/null && supabase stop --no-backup >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/restore-files" "$RUNNER_TEMP/backup.tar.gz" \
            "$RUNNER_TEMP/schema-restore.log" "$RUNNER_TEMP/data-restore.log" "$RUNNER_TEMP/public-only-restore.log" \
            "$RUNNER_TEMP/supabase-start.log" "$RUNNER_TEMP/public-table-count" "$RUNNER_TEMP/integrity-errors.log"
